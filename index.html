<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux App Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:       #2d353b;
            --bg-dark:  #232a2e;
            --bg-light: #343f44;
            --bg-card:  #3d4a51;
            --text:     #d3c6aa;
            --text-dim: #859289;
            --green:    #a7c080;
            --blue:     #7fbbb3;
            --red:      #e67e80;
            --yellow:   #dbbc7f;
            --orange:   #e69875;
            --border:   rgba(167,192,128,.15);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* ── HEADER ── */
        header {
            text-align: center;
            padding: 3.5rem 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 2rem;
            font-weight: 600;
            color: var(--green);
            letter-spacing: -.02em;
            margin-bottom: .4rem;
        }

        header p {
            color: var(--text-dim);
            font-size: .9rem;
        }

        /* ── SEARCH ── */
        .search-wrap {
            max-width: 560px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            position: relative;
        }

        #search {
            width: 100%;
            padding: .85rem 1rem .85rem 2.8rem;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: .95rem;
            outline: none;
            transition: border-color .2s;
        }

        #search::placeholder { color: var(--text-dim); }

        #search:focus { border-color: var(--green); }

        .search-icon {
            position: absolute;
            left: 2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 1rem;
            pointer-events: none;
        }

        /* ── APP GRID ── */
        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 1.5rem 4rem;
        }

        #app-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        /* ── CARD ── */
        .card {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem 1.25rem 1rem;
            display: flex;
            flex-direction: column;
            gap: .75rem;
            transition: border-color .2s, transform .2s;
            cursor: default;
        }

        .card:hover {
            border-color: rgba(167,192,128,.35);
            transform: translateY(-2px);
        }

        .card-head {
            display: flex;
            align-items: center;
            gap: .85rem;
        }

        .card-head img, .card-icon-fallback {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            flex-shrink: 0;
            object-fit: contain;
            background: var(--bg-dark);
            padding: 4px;
        }

        .card-icon-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--green);
        }

        .card-info { flex: 1; min-width: 0; }

        .card-name {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: .3rem;
            font-size: .72rem;
            font-family: 'IBM Plex Mono', monospace;
            padding: .15rem .5rem;
            border-radius: 4px;
            margin-top: .25rem;
        }

        .badge.supported   { background: rgba(167,192,128,.12); color: var(--green); }
        .badge.alternative { background: rgba(219,188,127,.12); color: var(--yellow); }
        .badge.unsupported { background: rgba(230,126,128,.12); color: var(--red); }

        /* ── CARD ACTIONS ── */
        .card-actions {
            display: flex;
            gap: .5rem;
            justify-content: flex-end;
        }

        .btn {
            padding: .42rem .9rem;
            border: none;
            border-radius: 6px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: .78rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity .15s, transform .15s;
        }

        .btn:hover  { opacity: .85; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }

        .btn-install { background: var(--green);  color: var(--bg-dark); }
        .btn-info    { background: var(--blue);   color: var(--bg-dark); }

        /* ── NO RESULTS ── */
        .no-results {
            grid-column: 1/-1;
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-dim);
        }

        .no-results span { font-size: 2rem; display: block; margin-bottom: .75rem; }

        /* ── MODAL ── */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(35,42,46,.88);
            backdrop-filter: blur(6px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .modal-backdrop.open { display: flex; }

        .modal {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 620px;
            max-height: 88vh;
            overflow-y: auto;
            position: relative;
            animation: modalIn .22s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(12px) scale(.97); }
            to   { opacity: 1; transform: translateY(0)     scale(1);   }
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.4rem 1.5rem 1rem;
            border-bottom: 1px solid var(--border);
        }

        .modal-header img, .modal-header-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            flex-shrink: 0;
            object-fit: contain;
            background: var(--bg-dark);
            padding: 5px;
        }

        .modal-header-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            font-size: 1.2rem;
            color: var(--green);
        }

        .modal-title { font-weight: 600; font-size: 1.1rem; color: var(--text); }

        .modal-close {
            margin-left: auto;
            background: var(--red);
            color: #fff;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform .15s;
        }

        .modal-close:hover { transform: scale(1.1); }

        .modal-body { padding: 1.25rem 1.5rem 1.5rem; }

        /* TABS */
        .tabs { display: flex; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; }

        .tab-btn {
            padding: .4rem .9rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-light);
            color: var(--text-dim);
            font-family: 'IBM Plex Mono', monospace;
            font-size: .78rem;
            cursor: pointer;
            transition: all .15s;
        }

        .tab-btn:hover  { border-color: var(--green); color: var(--green); }
        .tab-btn.active { background: var(--green); color: var(--bg-dark); border-color: var(--green); }

        /* CODE BLOCK */
        .code-block {
            position: relative;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 3rem 1rem 1rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: .82rem;
            color: var(--yellow);
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.7;
        }

        .copy-btn {
            position: absolute;
            top: .6rem;
            right: .6rem;
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text-dim);
            font-size: .75rem;
            font-family: 'IBM Plex Mono', monospace;
            padding: .25rem .55rem;
            cursor: pointer;
            transition: all .15s;
        }

        .copy-btn:hover { border-color: var(--green); color: var(--green); }

        /* SCREENSHOT */
        .screenshot-wrap { text-align: center; }

        .screenshot-wrap img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .screenshot-wrap .no-ss {
            padding: 2.5rem 1rem;
            color: var(--text-dim);
            font-size: .9rem;
        }

        /* WEBSITE LINK */
        .website-link {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            margin-top: 1rem;
            padding: .55rem 1rem;
            background: var(--blue);
            color: var(--bg-dark);
            border-radius: 6px;
            text-decoration: none;
            font-family: 'IBM Plex Mono', monospace;
            font-size: .82rem;
            font-weight: 600;
            transition: opacity .15s;
        }

        .website-link:hover { opacity: .85; }

        /* ALTERNATIVES */
        .alt-item {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-left: 3px solid var(--yellow);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: .75rem;
        }

        .alt-item h4 { color: var(--yellow); margin-bottom: .3rem; font-size: .95rem; }
        .alt-item p  { color: var(--text-dim); font-size: .85rem; margin-bottom: .5rem; }

        /* UNSUPPORTED REASON */
        .reason-block {
            background: var(--bg-dark);
            border-left: 3px solid var(--red);
            border-radius: 8px;
            padding: 1rem;
            color: var(--text-dim);
            font-size: .88rem;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 3px; }

        @media (max-width: 600px) {
            header h1 { font-size: 1.5rem; }
            #app-list  { grid-template-columns: 1fr; }
            .modal     { max-height: 95vh; }
        }
    </style>
</head>
<body>

<header>
    <h1>Linux App Hub</h1>
    <p>Popüler uygulamaların Linux desteğini keşfet</p>
</header>

<div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search" placeholder="Uygulama ara…" autocomplete="off" spellcheck="false">
</div>

<main>
    <div id="app-list"></div>
</main>

<!-- MODAL -->
<div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true">
        <div class="modal-header">
            <div id="modal-icon"></div>
            <span class="modal-title" id="modal-title"></span>
            <button class="modal-close" id="modal-close" aria-label="Kapat">✕</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
    </div>
</div>

<script src="./assest/app/apps.js"></script>
<script>
/* ══════════════════════════════════════════════════════════
   apps değişkeni apps.js dosyasından gelir
   ══════════════════════════════════════════════════════════ */
const listEl = document.getElementById('app-list');

function statusBadge(app) {
    if (app.supported)              return ['supported',   '✓ Destekleniyor'];
    if (app.alternatives?.length)   return ['alternative', '⚠ Alternatif Var'];
    return                                  ['unsupported', '✗ Desteklenmiyor'];
}

function createIcon(app, size = 44) {
    const img = document.createElement('img');
    img.src    = app.icon;
    img.alt    = app.name;
    img.width  = size;
    img.height = size;
    img.onerror = () => {
        const fb = document.createElement('div');
        fb.className = 'card-icon-fallback';
        fb.style.width = fb.style.height = size + 'px';
        fb.style.minWidth = size + 'px';
        fb.textContent = app.name[0];
        img.replaceWith(fb);
    };
    return img;
}

function renderCards(list) {
    listEl.innerHTML = '';

    if (!list.length) {
        listEl.innerHTML = '<div class="no-results"><span>◌</span>Uygulama bulunamadı.</div>';
        return;
    }

    list.forEach(app => {
        const [cls, label] = statusBadge(app);

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="card-head">
                <div class="card-img-slot"></div>
                <div class="card-info">
                    <div class="card-name">${app.name}</div>
                    <span class="badge ${cls}">${label}</span>
                </div>
            </div>
            <div class="card-actions">
                ${app.supported ? `<button class="btn btn-install" data-action="install" title="Kurulum">$ install</button>` : ''}
                <button class="btn btn-info" data-action="info" title="Bilgi / Ekran Görüntüsü">info</button>
            </div>`;

        card.querySelector('.card-img-slot').appendChild(createIcon(app));

        card.querySelector('[data-action="info"]')
            .addEventListener('click', () => openModal(app, 'info'));

        if (app.supported) {
            card.querySelector('[data-action="install"]')
                .addEventListener('click', () => openModal(app, 'install'));
        }

        listEl.appendChild(card);
    });
}

/* ═══════════════════════  SEARCH  ═══════════════════════ */
const sorted = [...apps].sort((a, b) => a.name.localeCompare(b.name, 'tr'));
renderCards(sorted);

document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    renderCards(q ? sorted.filter(a => a.name.toLowerCase().includes(q)) : sorted);
});

/* ═══════════════════════  MODAL  ═══════════════════════ */
const backdrop  = document.getElementById('modal-backdrop');
const modalIcon = document.getElementById('modal-icon');
const modalTitle= document.getElementById('modal-title');
const modalBody = document.getElementById('modal-body');

document.getElementById('modal-close').addEventListener('click', closeModal);
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function closeModal() {
    backdrop.classList.remove('open');
    modalBody.innerHTML = '';
}

function openModal(app, mode) {
    // icon
    modalIcon.innerHTML = '';
    modalIcon.appendChild(createIcon(app, 48));

    modalTitle.textContent = app.name;

    if (mode === 'install') {
        renderInstall(app);
    } else {
        renderInfo(app);
    }

    backdrop.classList.add('open');
}

/* ── INSTALL ── */
function renderInstall(app) {
    const distros = Object.keys(app.install);
    let active = 0;

    const tabs   = document.createElement('div');
    tabs.className = 'tabs';

    const content = document.createElement('div');

    function switchTab(i) {
        tabs.querySelectorAll('.tab-btn').forEach((b, j) => b.classList.toggle('active', i === j));
        content.innerHTML = '';
        const cmd = Object.values(app.install)[i];
        const block = document.createElement('div');
        block.className = 'code-block';
        block.textContent = cmd;

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = 'kopyala';
        copyBtn.onclick = () => {
            navigator.clipboard.writeText(cmd).then(() => {
                copyBtn.textContent = 'kopyalandı!';
                setTimeout(() => copyBtn.textContent = 'kopyala', 1800);
            });
        };
        block.appendChild(copyBtn);
        content.appendChild(block);
    }

    distros.forEach((d, i) => {
        const b = document.createElement('button');
        b.className = 'tab-btn' + (i === 0 ? ' active' : '');
        b.textContent = d;
        b.onclick = () => switchTab(i);
        tabs.appendChild(b);
    });

    modalBody.innerHTML = '';
    modalBody.appendChild(tabs);
    modalBody.appendChild(content);
    switchTab(0);
}

/* ── INFO ── */
function renderInfo(app) {
    modalBody.innerHTML = '';

    if (app.alternatives?.length) {
        // Alternatives list
        app.alternatives.forEach(alt => {
            const el = document.createElement('div');
            el.className = 'alt-item';
            el.innerHTML = `<h4>${alt.name}</h4><p>${alt.desc}</p>
                <a class="website-link" href="${alt.url}" target="_blank" rel="noopener">↗ Siteye git</a>`;
            modalBody.appendChild(el);
        });
        return;
    }

    if (app.reason) {
        const el = document.createElement('div');
        el.className = 'reason-block';
        el.textContent = app.reason;
        modalBody.appendChild(el);
        if (app.about?.website) {
            const link = document.createElement('a');
            link.href = app.about.website;
            link.target = '_blank';
            link.rel = 'noopener';
            link.className = 'website-link';
            link.style.marginTop = '1rem';
            link.textContent = '↗ Resmi site';
            modalBody.appendChild(link);
        }
        return;
    }

    // Supported app → screenshot tabs
    const tabs    = document.createElement('div');
    tabs.className = 'tabs';

    const btnSS   = makeTab('Ekran Görüntüsü', true);
    const btnSite = makeTab('Web Sitesi', false);
    tabs.append(btnSS, btnSite);

    const content = document.createElement('div');

    function makeTab(label, active) {
        const b = document.createElement('button');
        b.className = 'tab-btn' + (active ? ' active' : '');
        b.textContent = label;
        return b;
    }

    function setActive(sel) {
        [btnSS, btnSite].forEach(b => b.classList.toggle('active', b === sel));
    }

    btnSS.onclick = () => {
        setActive(btnSS);
        content.innerHTML = '';
        if (app.about?.screenshot) {
            const wrap = document.createElement('div');
            wrap.className = 'screenshot-wrap';
            const img = document.createElement('img');
            img.src = app.about.screenshot;
            img.alt = app.name;
            img.onerror = () => { wrap.innerHTML = '<div class="no-ss">Ekran görüntüsü bulunamadı.</div>'; };
            wrap.appendChild(img);
            content.appendChild(wrap);
        } else {
            content.innerHTML = '<div class="screenshot-wrap"><div class="no-ss">Bu uygulama için henüz ekran görüntüsü eklenmedi.</div></div>';
        }
    };

    btnSite.onclick = () => {
        setActive(btnSite);
        content.innerHTML = '';
        if (app.about?.website) {
            const a = document.createElement('a');
            a.href = app.about.website;
            a.target = '_blank';
            a.rel = 'noopener';
            a.className = 'website-link';
            a.textContent = '↗ ' + app.about.website;
            content.appendChild(a);
        }
    };

    modalBody.appendChild(tabs);
    modalBody.appendChild(content);
    btnSS.click();
}
</script>
</body>
</html>
